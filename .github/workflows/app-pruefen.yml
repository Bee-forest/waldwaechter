name: Veröffentlichte App prüfen (Chrome und iPhone/WebKit)

on:
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium webkit
      - run: mkdir -p pruefung && node tools/app_pruefen.cjs
      - uses: actions/upload-artifact@v4
        with: { name: pruefung, path: pruefung }
