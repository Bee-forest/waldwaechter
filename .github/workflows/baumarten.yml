name: Baumarten und Alter laden

on:
  push:
    paths: ['tools/baumarten_tiles.py', '.github/workflows/baumarten.yml', 'data/regionen.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baumarten
  cancel-in-progress: false

jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyshp
      - run: rm -rf data/baumarten && python3 tools/baumarten_tiles.py
      - run: |
          git config user.name "Waldwächter-Daten"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/baumarten
          git commit -m "Baumarten und Alter aktualisiert" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 15; done
