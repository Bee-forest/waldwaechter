name: Dienste prüfen

on:
  push:
    paths: ['tools/check_dienste.py', 'tools/check_felder.py', 'tools/check_hoehe.py', 'tools/check_baumarten.py', 'tools/check_dom.py', '.github/workflows/check.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_dom.py
        continue-on-error: true
      - run: |
          git config user.name "Waldwächter-Daten"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/geodienste/dom.txt
          git commit -m "Dienste geprüft" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
