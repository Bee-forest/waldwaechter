name: Ortsnamen laden

on:
  push:
    paths: ['tools/orte.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/orte.py
      - run: |
          git config user.name "Waldwächter-Daten"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/orte.json
          git commit -m "Ortsnamen Thüringen (OSM) aktualisiert" || echo "Keine Änderungen"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
