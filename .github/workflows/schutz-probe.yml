name: Schutzgebiete-Attribute prüfen (temporär)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Abfragen
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, math, re
          GP = 'https://www.geoproxy.geoportal-th.de/geoproxy/services/SCHUTZGEB'
          def get(u, n=3000):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'}), timeout=40)
                  return r.status, r.read().decode('utf-8', 'replace')[:n]
              except Exception as e: return 'ERR', str(e)
          st, cap = get(GP + '?SERVICE=WMS&REQUEST=GetCapabilities', 200000)
          print('CAP', st, re.findall(r'<Name>([^<]+)</Name>', cap)[:60])
          def gfi(layer, lat, lng):
              R=6378137; x=lng*math.pi/180*R; y=math.log(math.tan(math.pi/4+lat*math.pi/360))*R; h=100
              q=urllib.parse.urlencode({'SERVICE':'WMS','VERSION':'1.3.0','REQUEST':'GetFeatureInfo','LAYERS':layer,'QUERY_LAYERS':layer,'STYLES':'','CRS':'EPSG:3857','BBOX':f'{x-h},{y-h},{x+h},{y+h}','WIDTH':'101','HEIGHT':'101','I':'50','J':'50','INFO_FORMAT':'application/vnd.ogc.gml','FEATURE_COUNT':'3'})
              return get(GP+'?'+q, 6000)
          for layer, lat, lng in [('nsg', 50.6905, 10.9100), ('nsg', 50.915, 11.62), ('lsg', 50.68, 10.92), ('ffh_geb', 50.915, 11.62), ('spa', 50.62, 10.8), ('naturpark', 50.65, 10.85)]:
              st, b = gfi(layer, lat, lng)
              print('=====', layer, lat, lng, st); print(re.sub(r'\s+', ' ', b)[:3000])
          # mögliche WFS
          for u in [GP.replace('SCHUTZGEB','SCHUTZGEB_WFS') + '?SERVICE=WFS&REQUEST=GetCapabilities', 'https://www.geoproxy.geoportal-th.de/geoproxy/services/INSPIRE_PS?SERVICE=WFS&REQUEST=GetCapabilities',
                    'https://tlubn.thueringen.de/naturschutz/schutzgebiete', 'https://tlubn.thueringen.de/naturschutz/schutzgebiete/naturschutzgebiete', 'https://landesrecht.thueringen.de/bsth/search?query=Naturschutzgebiet']:
              st, b = get(u, 1500); print('-----', u, st); print(re.sub(r'\s+',' ', b)[:1500])
          PY
