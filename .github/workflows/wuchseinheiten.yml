name: Wuchseinheiten laden

on:
  push:
    paths: ['tools/wuchseinheiten.py', '.github/workflows/wuchseinheiten.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyshp
      - run: python3 tools/wuchseinheiten.py
      - name: Ergebnis speichern
        run: |
          git config user.name "Waldwächter-Daten"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bzt/wuchseinheiten.json
          git commit -m "Wuchseinheiten Thüringen geladen" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
